name: Audit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 mypy

      - name: Lint with flake8
        run: |
          flake8 skills/production-hardening/scripts/hardening_audit.py tests/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 skills/production-hardening/scripts/hardening_audit.py tests/ \
            --count --exit-zero --max-complexity=12 --max-line-length=100 --statistics

      - name: Type check with mypy
        run: |
          mypy skills/production-hardening/scripts/hardening_audit.py --ignore-missing-imports || true

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Self-audit (Verification Gate)
        run: |
          python skills/production-hardening/scripts/hardening_audit.py . --json
        continue-on-error: false
