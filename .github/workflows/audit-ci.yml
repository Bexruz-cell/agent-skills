name: Audit CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8

      - name: Sync registry docs from JSON source of truth
        run: |
          python scripts/generate_registry_docs.py

      - name: Lint with flake8
        run: |
          flake8 skills/production-hardening/scripts/hardening_audit.py agent_skills/ tests/ scripts/ \
            --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 skills/production-hardening/scripts/hardening_audit.py agent_skills/ tests/ scripts/ \
            --count --exit-zero --max-complexity=15 --max-line-length=110 --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short

      - name: Repository Acceptance
        run: |
          python -m agent_skills.cli validate --skip-heavy

      - name: Repository Acceptance (JSON)
        run: |
          python -m agent_skills.cli validate --json --skip-heavy | python -c "import sys,json; d=json.load(sys.stdin); assert d['accepted'] is True, d; print('accepted=true')"

      - name: Self-audit (Verification Gate)
        run: |
          python skills/production-hardening/scripts/hardening_audit.py . --json
        continue-on-error: false
