[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skills"
version = "1.4.0"
description = "Production-grade Agent Skills library for autonomous AI coding agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Bexruz-cell"}]
keywords = ["agent-skills", "ai-agents", "security", "hardening", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
agent-skills = "agent_skills.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_skills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
